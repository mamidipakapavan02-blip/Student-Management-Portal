<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background-color:#f8f9fa;
}

.form-container{
    max-width:900px;
    margin:auto;
}

.header{
    background-color:#0d6efd;
    color:white;
    padding:15px;
    text-align:center;
}

footer{
    background-color:#212529;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

</style>

</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">
🎓 College Portal
</a>

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="index.html">Home</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="register.html">
Register
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="dashboard.html">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="profile.html">
Profile
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="contact.html">
Contact
</a>
</li>

</ul>

</div>

</nav>

<!-- Registration Form -->

<div class="container my-5">

<div class="card shadow form-container">

<div class="header">
<h2>Student Registration Form</h2>
</div>

<div class="card-body">

<form>

<!-- Full Name -->

<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<!-- Roll Number -->

<div class="mb-3">

<label class="form-label">
Roll Number
</label>

<div class="input-group">

<span class="input-group-text">
#
</span>

<input
type="text"
class="form-control"
placeholder="Enter Roll Number">

</div>

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<div class="input-group">

<span class="input-group-text">
@
</span>

<input
type="email"
class="form-control"
placeholder="Enter Email">

</div>

</div>

<!-- Mobile Number -->

<div class="mb-3">

<label class="form-label">
Mobile Number
</label>

<input
type="tel"
class="form-control"
placeholder="Enter Mobile Number">

</div>

<!-- Gender -->

<div class="mb-3">

<label class="form-label d-block">
Gender
</label>

<div class="form-check form-check-inline">

<input
class="form-check-input"
type="radio"
name="gender">

<label class="form-check-label">
Male
</label>

</div>

<div class="form-check form-check-inline">

<input
class="form-check-input"
type="radio"
name="gender">

<label class="form-check-label">
Female
</label>

</div>

<div class="form-check form-check-inline">

<input
class="form-check-input"
type="radio"
name="gender">

<label class="form-check-label">
Other
</label>

</div>

</div>

<!-- Branch -->

<div class="mb-3">

<label class="form-label">
Branch
</label>

<select class="form-select">

<option selected>
Select Branch
</option>

<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>MECH</option>
<option>CIVIL</option>

</select>

</div>

<!-- Date of Birth -->

<div class="mb-3">

<label class="form-label">
Date of Birth
</label>

<input
type="date"
class="form-control">

</div>

<!-- Address -->

<div class="mb-3">

<label class="form-label">
Address
</label>

<textarea
class="form-control"
rows="4"
placeholder="Enter Address">
</textarea>

</div>

<!-- Upload Photo -->

<div class="mb-3">

<label class="form-label">
Upload Photo
</label>

<input
type="file"
class="form-control">

</div>

<!-- Terms -->

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox">

<label class="form-check-label">
I agree to the Terms and Conditions
</label>

</div>

<!-- Buttons -->

<div class="text-center">

<button
type="submit"
class="btn btn-success me-2">
Register
</button>

<button
type="reset"
class="btn btn-danger">
Reset
</button>

</div>

</form>

</div>

</div>

</div>


<!-- Footer -->

<footer>

<p>
© 2026 Student Management Portal
</p>

<p>
Student Registration Page
</p>

</footer>

</body>
</html>
